<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロマカレンタカー - 予約ダッシュボード v7.0</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --border:#333; --text:#eee; --muted:#999; --accent:#7cfa7c; --warn:#ffcc00; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(17,17,17,0.9);backdrop-filter:blur(8px);z-index:10}
  header h1{margin:0;font-size:18px}
  .meta{color:var(--muted);font-size:12px}
  .container{padding:16px;max-width:1600px;margin:0 auto}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,select,button,textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  button{cursor:pointer}
  button.primary{background:var(--text);color:#000;font-weight:600}
  button:hover{opacity:0.9}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--border);padding:8px 6px;text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;position:sticky;top:60px;background:var(--bg)}
  td.memo{white-space:normal;max-width:240px;word-break:break-word}
  .badge{padding:2px 6px;border-radius:6px;font-size:11px;border:1px solid var(--border)}
  .badge.ok{background:#143214;border-color:#2a5a2a;color:var(--accent)}
  .badge.no{background:#2a1a1a;border-color:#5a2a2a;color:#ff8888}
  .tableWrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:12px}
  .right{margin-left:auto}
  .small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>ロマカレンタカー - 予約ダッシュボード v7.0 <span class="small">A-T新レイアウト対応</span></h1>
  <div class="meta" id="updatedAt">読み込み中...</div>
</header>
<div class="container">

  <div class="card">
    <h3 style="margin:0 0 10px">＋ 電話・手動予約を追加</h3>
    <div class="grid">
      <input id="f_name" placeholder="氏名 * 例: 山本 侑駕">
      <input id="f_vehicle" placeholder="車両名 * 例: アクア 比恵町">
      <input id="f_place" placeholder="場所 * 例: 比恵町">
      <input id="f_price" type="number" placeholder="金額 (円)">
      <input id="f_start" type="datetime-local">
      <input id="f_end" type="datetime-local">
      <input id="f_number" placeholder="ナンバー4桁">
      <input id="f_phone" placeholder="電話番号">
      <input id="f_email" placeholder="メールアドレス">
      <textarea id="f_memo" placeholder="メモ（任意）" style="grid-column:span 2"></textarea>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="primary" onclick="addReservation()">追加する</button>
      <span class="small">※ 氏名は空白で姓・名に自動分割されます。メモはT列(最右端)に保存</span>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <input id="q" placeholder="検索: 氏名/車両/場所/電話/メモ" oninput="render()" style="min-width:260px">
      <select id="filterPlace" onchange="render()"><option value="">全場所</option></select>
      <select id="sortBy" onchange="render()">
        <option value="reserveId_desc">予約ID 新しい順</option>
        <option value="start_asc">出発 早い順</option>
        <option value="yoyaku_desc">予約日 新しい順（最後の予約が誰か）</option>
      </select>
      <button onclick="loadData()">再読み込み</button>
      <span class="right small" id="count"></span>
    </div>
    <div class="tableWrap">
      <table id="tbl">
        <thead>
          <tr>
            <th>予約ID</th><th>氏名(B)</th><th>姓(C)</th><th>名(D)</th><th>車両名(E)</th><th>場所(F)</th>
            <th>出発日時(G)</th><th>返却日時(H)</th><th>金額(I)</th><th>ナンバー(J)</th>
            <th>決済(K)</th><th>LINE(L)</th><th>確認(M)</th>
            <th>メール(N)</th><th>電話(O)</th><th>予約日(P)</th><th>メモ(T)</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ▼▼▼ ここにSS側のGAS WebアプリURLを貼る ▼▼▼
const GAS_URL = 'https://script.google.com/macros/s/【あなたのWebアプリURL】/exec';

let allData = [];

async function loadData(){
  document.getElementById('updatedAt').textContent = '読み込み中... v7.0';
  try{
    const res = await fetch(GAS_URL);
    const json = await res.json();
    allData = json.reservations || [];
    // 場所フィルタ作成
    const places = [...new Set(allData.map(r=>r['場所']||r['場所マスタ']||'').filter(Boolean))];
    const sel = document.getElementById('filterPlace');
    sel.innerHTML = '<option value="">全場所</option>' + places.map(p=>`<option>${p}</option>`).join('');
    document.getElementById('updatedAt').textContent = '更新: ' + new Date(json.updatedAt||Date.now()).toLocaleString() + ' / ' + allData.length + '件';
    render();
  }catch(e){
    document.getElementById('updatedAt').textContent = '読み込み失敗: ' + e.message;
    console.error(e);
  }
}

function render(){
  const q = document.getElementById('q').value.toLowerCase();
  const place = document.getElementById('filterPlace').value;
  const sortBy = document.getElementById('sortBy').value;
  let data = [...allData];
  if(q){
    data = data.filter(r=> Object.values(r).join(' ').toLowerCase().includes(q));
  }
  if(place){
    data = data.filter(r=> (r['場所']||'')===place);
  }
  if(sortBy==='reserveId_desc'){
    data.sort((a,b)=> String(b['予約ID']||'').localeCompare(String(a['予約ID']||'')));
  }else if(sortBy==='start_asc'){
    data.sort((a,b)=> new Date(a['出発(ソート用)']||a['出発日時']||0) - new Date(b['出発(ソート用)']||b['出発日時']||0));
  }else if(sortBy==='yoyaku_desc'){
    data.sort((a,b)=> new Date(b['予約日(ソート用)']||b['予約日']||0) - new Date(a['予約日(ソート用)']||a['予約日']||0));
  }
  document.getElementById('count').textContent = data.length + '件表示';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = data.slice(0,500).map(r=>{
    const id = r['予約ID']||'';
    const chk = (f)=> {
      const v = r[f];
      const isTrue = v===true || v==='TRUE' || v==='true';
      return `<input type="checkbox" ${isTrue?'checked':''} onchange="updateField('${id}','${f}',this.checked)">`;
    };
    return `<tr>
      <td>${id}</td>
      <td>${esc(r['氏名']||'')}</td>
      <td>${esc(r['姓']||'')}</td>
      <td>${esc(r['名']||'')}</td>
      <td>${esc(r['車両名']||'')}</td>
      <td>${esc(r['場所']||'')}</td>
      <td>${esc(r['出発日時']||'')}</td>
      <td>${esc(r['返却日時']||'')}</td>
      <td>${esc(r['金額']||'')}</td>
      <td>${esc(r['ナンバー(4桁)']||'')}</td>
      <td>${chk('決済完了')}</td>
      <td>${chk('LINE登録')}</td>
      <td>${chk('確認済み')}</td>
      <td>${esc(r['メール']||'')}</td>
      <td>${esc(r['電話']||'')}</td>
      <td>${esc(r['予約日']||'')}</td>
      <td class="memo">${esc(r['メモ']||'')}</td>
    </tr>`;
  }).join('');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function updateField(id, field, value){
  try{
    await fetch(GAS_URL, {method:'POST', body: JSON.stringify({id, field, value})});
  }catch(e){ alert('更新失敗: '+e.message); }
}

async function addReservation(){
  const name = document.getElementById('f_name').value.trim();
  const vehicle = document.getElementById('f_vehicle').value.trim();
  const place = document.getElementById('f_place').value.trim();
  const start = document.getElementById('f_start').value;
  const end = document.getElementById('f_end').value;
  if(!name||!vehicle||!place||!start||!end){ alert('必須項目を入力してください'); return; }
  const price = document.getElementById('f_price').value;
  const number = document.getElementById('f_number').value;
  const phone = document.getElementById('f_phone').value;
  const email = document.getElementById('f_email').value;
  const memo = document.getElementById('f_memo').value;

  const data = {
    '氏名': name,
    '車両名': vehicle,
    '場所': place,
    '金額': price,
    'ナンバー(4桁)': number,
    '電話': phone,
    'メール': email,
    'メモ': memo,
    '出発日時': start.replace('T',' ') ,
    '返却日時': end.replace('T',' '),
    '出発(ソート用)': new Date(start),
    '返却(ソート用)': new Date(end),
  };
  try{
    const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'add', data})});
    const json = await res.json();
    if(json.success){ alert('追加しました: '+json.id); loadData(); }
    else alert('失敗: '+json.error);
  }catch(e){ alert('追加失敗: '+e.message); }
}

loadData();
</script>
</body>
</html>
